name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:design
      - run: pnpm typecheck
      - run: pnpm build

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm --dir studio install --frozen-lockfile
      - run: pnpm --dir studio exec tsc --noEmit
      - name: Check generated types are up to date
        run: pnpm --dir studio typegen && git diff --exit-code src/sanity/types.ts
      - run: pnpm --dir studio build
